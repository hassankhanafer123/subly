<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Subly — Design Mockups (OpenDesign · Airbnb system)</title>
<style>
  :root { --ink:#222; --muted:#6a6a6a; --accent:#ff385c; --border:#ddd; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:#f2f0ec; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    padding:32px 24px 64px;
  }
  .head { max-width:1200px; margin:0 auto 28px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .mark { width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800; }
  h1 { font-size:26px; letter-spacing:-.5px; margin:0; }
  .sub { color:var(--muted); font-size:14px; margin:6px 0 0; }
  .grid {
    max-width:1200px; margin:0 auto;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
    gap:36px 24px;
  }
  .cell { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .label { font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); text-transform:uppercase; }
  .label b { color:var(--ink); font-weight:700; }
  /* scale the 390x844 device down to fit the cell */
  .frame-wrap { width:300px; height:650px; overflow:hidden; border-radius:40px; }
  iframe {
    width:390px; height:844px; border:0;
    transform:scale(0.769); transform-origin:top left;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="brand"><span class="mark">S</span><h1>Subly — new design</h1></div>
    <p class="sub">6 screens · generated through OpenDesign's mobile-app engine · Airbnb design system · general audience (no school/edu)</p>
  </div>
  <div class="grid">
    <div class="cell"><span class="label"><b>1.</b> Onboarding</span><div class="frame-wrap"><iframe src="onboarding.html"></iframe></div></div>
    <div class="cell"><span class="label"><b>2.</b> Explore</span><div class="frame-wrap"><iframe src="explore.html"></iframe></div></div>
    <div class="cell"><span class="label"><b>3.</b> Listing detail</span><div class="frame-wrap"><iframe src="detail.html"></iframe></div></div>
    <div class="cell"><span class="label"><b>4.</b> List your place</span><div class="frame-wrap"><iframe src="list.html"></iframe></div></div>
    <div class="cell"><span class="label"><b>5.</b> Deals</span><div class="frame-wrap"><iframe src="deals.html"></iframe></div></div>
    <div class="cell"><span class="label"><b>6.</b> Payments</span><div class="frame-wrap"><iframe src="payments.html"></iframe></div></div>
  </div>
</body>
</html>
